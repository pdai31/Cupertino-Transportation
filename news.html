<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News & Updates — Cupertino Safe Streets</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="page-header">
  <div class="container">
    <h1>📰 News & Updates</h1>
    <p>Progress reports, milestones, and stories from the Cupertino Safe Streets team.</p>
  </div>
</header>

<section class="page-section">
    <div class="container">

        <div id="news-container"></div>

    </div>
</section>

<script src="js/data.js"></script>
<script src="js/main.js"></script>

<script>

const container = document.getElementById("news-container");

newsData.forEach(item => {

    container.innerHTML += `
        <div class="card news-item">

            <div class="news-date">${item.date}</div>

            <div>

                <span class="badge badge-cat">${item.type}</span>

                <h3>${item.title}</h3>

                <p>${item.summary}</p>

                <a
                    class="btn btn-resource"
                    href="${item.link}"
                    ${item.link.startsWith("http") ? 'target="_blank"' : ""}
                >
                    ${item.button}
                </a>

            </div>

        </div>
    `;

});

</script>
</body>
</html>
